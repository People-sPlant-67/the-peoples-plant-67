name: Release

# Builds the Chrome extension zip. On a v* tag it also makes a DRAFT GitHub release with the zip
# attached: nothing is published until someone presses Publish on the release page. Run by hand
# (Actions, Release, Run workflow) to get the zip as a build artifact without any release.
#
# Three jobs, so no job holds two dangerous things at once (see ci.yml): `build` installs npm
# packages but has no secret and cannot write to the repo; `scan` holds the deny list but
# installs nothing; `release` can write releases but runs no project code at all. Artifacts are
# unpacked outside the checkout, and the zip's name is checked rather than trusted, so nothing the
# build job hands over can replace the scanner or point the release at another file. Actions are
# pinned to the commit of their v4.
# The release notes are left for the owner to write: generated notes would list contributors'
# GitHub handles, which nothing scans.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The strict leak scan needs the private deny list, which only the main repo has.
    if: github.repository == 'People-sPlant-67/the-peoples-plant-67'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json version $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run ext
      - name: Zip
        run: (cd dist-extension && zip -qrX "../the-peoples-plant-67-extension-v${{ steps.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zip
          path: the-peoples-plant-67-extension-v*.zip
          if-no-files-found: error

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-zip
          path: ${{ runner.temp }}/zip
      - name: Leak scan (the zip's contents)
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
        run: |
          cd "$RUNNER_TEMP/zip"
          ZIP=$(ls)
          if ! printf '%s' "$ZIP" | grep -Eqx 'the-peoples-plant-67-extension-v[0-9]+\.[0-9]+\.[0-9]+\.zip'; then
            echo "The artifact should hold exactly one extension zip, not: $ZIP" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/unzipped"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unzipped"
          cd "$GITHUB_WORKSPACE"
          node scripts/leak-scan.mjs --dir "$RUNNER_TEMP/unzipped" --require-deny

  release:
    needs: [build, scan]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-zip
          path: ${{ runner.temp }}/zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The name comes from the tag, not from anything the build job said.
          ZIP="$RUNNER_TEMP/zip/the-peoples-plant-67-extension-$GITHUB_REF_NAME.zip"
          test -f "$ZIP"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "The People's Plant #67 $GITHUB_REF_NAME" --notes "Write the notes before publishing."
