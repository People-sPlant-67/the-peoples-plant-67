name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The private deny list (the LEAK_DENY secret) never shares a job with installed npm packages:
# an install script could otherwise read it or rewrite the scanner. Jobs that hold the secret
# run the scanner from a plain checkout with Node alone; the job that installs packages has no
# secret and hands its builds over as artifacts, which are unpacked outside the checkout so a
# poisoned artifact cannot overwrite the scanner. Actions are pinned to the commit of their v4.
#
# Strict means "fail without the deny list". Pushes to the main repo and pull requests from its
# own branches get the secret; forks and pull requests from forks run the generic checks only.

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Leak scan (files and history)
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          if [ "$HEAD_REPO" = "People-sPlant-67/the-peoples-plant-67" ]; then STRICT=--require-deny; fi
          node scripts/leak-scan.mjs $STRICT
          node scripts/leak-scan.mjs --history $STRICT

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # npm ci also builds the bridge (prepare), as npx does on an owner's machine.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Demo build
        run: npm run demo
      - name: Extension build
        run: npm run ext
      - name: The built bridge and hook script work together
        run: |
          set -e
          # Inside the home folder: the plant refuses shared folders such as /tmp.
          dir="$(mktemp -d "$HOME/plant-ci.XXXXXX")"
          node dist-bridge/cli.mjs --no-open --port 6799 --dir "$dir" > bridge.log 2>&1 &
          trap 'kill %1 2>/dev/null; cat bridge.log' EXIT
          # The bridge listens first, then takes the folder: ready once its lock is there.
          for i in $(seq 1 20); do test -f "$dir/bridge.lock" && curl -sf http://127.0.0.1:6799/api/plant-bridge > /dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:6799/api/plant-bridge | grep -q '"bridge":true'
          K="x-plant-key: $(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).key)" "$dir/bridge.lock")"
          api() { curl -sf -H "$K" "$@"; }
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"/tmp/ci-project"}' | CLAUDE_PROJECT_DIR= node dist-bridge/plant-hook.mjs claude --dir "$dir"
          curl -sf http://127.0.0.1:6799/ | grep -q '<script'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6799/api/companies)" = 401
          company="$(api http://127.0.0.1:6799/api/companies | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].id)")"
          agents="$(api "http://127.0.0.1:6799/api/companies/$company/agents")"
          echo "$agents" | grep -q '"name":"ci-project"'
          agent="$(echo "$agents" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].id)")"
          # A directive goes round: the plant posts it, the hook hands it over, Stop sends the answer back.
          issue="$(api -X POST -H 'Origin: http://127.0.0.1:6799' -H 'Content-Type: application/json' -d "{\"title\":\"Report\",\"description\":\"Report in.\",\"assigneeAgentId\":\"$agent\"}" "http://127.0.0.1:6799/api/companies/$company/issues" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).id)")"
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"/tmp/ci-project"}' | CLAUDE_PROJECT_DIR= node dist-bridge/plant-hook.mjs claude --dir "$dir" | grep -q 'Report in.'
          echo '{"hook_event_name":"Stop","session_id":"ci","cwd":"/tmp/ci-project","last_assistant_message":"All quiet."}' | CLAUDE_PROJECT_DIR= node dist-bridge/plant-hook.mjs claude --dir "$dir"
          api "http://127.0.0.1:6799/api/issues/$issue/comments" | grep -q 'All quiet.'
          api "http://127.0.0.1:6799/api/issues/$issue" | grep -q '"status":"answered"'
      - name: The npx package carries the bridge
        run: |
          # Some npm versions run prepare even here, and its log shares stdout: read from the JSON on.
          npm pack --dry-run --json --ignore-scripts > pack.out
          node -e "const t=require('fs').readFileSync('pack.out','utf8'); const f=JSON.parse(t.slice(t.search(/^\[/m)))[0].files.map(x=>x.path); for (const need of ['dist-bridge/cli.mjs','dist-bridge/plant-hook.mjs','dist-bridge/web/index.html']) if (!f.includes(need)) { console.error('The package is missing '+need); process.exit(1); } if (f.some(p=>p.startsWith('src/')||p.startsWith('docs/'))) { console.error('The package carries source or docs it does not need.'); process.exit(1); }"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builds
          path: |
            dist-demo
            dist-extension
            dist-bridge
          if-no-files-found: error
          retention-days: 3

  scan-builds:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: builds
          path: ${{ runner.temp }}/builds
      - name: Leak scan (demo, extension and bridge builds)
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          if [ "$HEAD_REPO" = "People-sPlant-67/the-peoples-plant-67" ]; then STRICT=--require-deny; fi
          node scripts/leak-scan.mjs --dir "$RUNNER_TEMP/builds/dist-demo" $STRICT
          node scripts/leak-scan.mjs --dir "$RUNNER_TEMP/builds/dist-extension" $STRICT
          node scripts/leak-scan.mjs --dir "$RUNNER_TEMP/builds/dist-bridge" $STRICT
